name: wheel-and-workflows
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m pip install dist/splitleak-0.1.0-py3-none-any.whl
      - run: python -c "import splitleak; assert 'site-packages' in splitleak.__file__; print('normal wheel import confirmed')"
      - run: python -m unittest discover -s tests -v
      - run: python examples/workflow.py
      - run: python benchmarks/contrast.py
      - run: python tools/verify_release.py
      - if: runner.os == 'Windows' && matrix.python == '3.14'
        run: python probes/console_layout.py --wheel dist/splitleak-0.1.0-py3-none-any.whl
      - run: splitleak audit examples/transitive.json --out output/cli-audit.json
      - run: splitleak explain examples/transitive.json A D
      - run: splitleak plan examples/transitive.json --out output/cli-proposal.json
      - run: splitleak apply examples/transitive.json output/cli-proposal.json --out output/cli-assignment.json
      - run: splitleak check examples/transitive.json output/cli-assignment.json
